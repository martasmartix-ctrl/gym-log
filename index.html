<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>GYM LOG</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020617">

<link rel="manifest" href="manifest.json">

<style>
/* ===== iOS SAFE AREA FIX ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #020617;
}

body {
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: #e5e7eb;
}

/* ===== THEME ===== */
:root{
  --bg:#020617;
  --card:#0b1220;
  --border:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --blue:#3b82f6;
  --purple:#8b5cf6;
  --gold:#facc15;
}

#app{
  max-width:480px;
  margin:0 auto;
  padding:20px;
  min-height:100vh;
}

/* ===== HEADER ===== */
header{
  text-align:center;
  margin-bottom:20px;
}
header h1{
  margin:0;
  font-size:22px;
  letter-spacing:1px;
}

/* ===== CARDS ===== */
.card{
  background:linear-gradient(180deg,#0b1220,#020617);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 0 30px rgba(59,130,246,.15);
}

/* ===== LEVEL ===== */
#levelName{
  color:var(--gold);
  font-weight:700;
}
.xpbar{
  height:10px;
  background:#020617;
  border-radius:8px;
  overflow:hidden;
  margin-top:8px;
}
#xpFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--gold),var(--blue));
}

/* ===== BUTTON ===== */
button{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:white;
  font-size:16px;
  font-weight:700;
  margin-top:10px;
}

/* ===== LIST ===== */
.item{
  background:#020617;
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-bottom:8px;
}

/* ===== INPUT ===== */
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
  margin-bottom:8px;
}

/* ===== GRAPH ===== */
canvas{
  width:100%;
  margin-top:10px;
}
</style>
</head>

<body>

<div id="app">

<header>
  <h1>Gym Log</h1>
</header>

<div class="card">
  <div id="levelName">Hobby Fitness</div>
  <div class="xpbar"><div id="xpFill"></div></div>
  <small id="xpText">0 / 100 XP</small>
</div>

<button onclick="alert('Trénink část můžeš dál rozšiřovat 👊')">
🏋️ Trénink
</button>

</div>

<script>
/* ===== XP SYSTEM ===== */
let xp = Number(localStorage.getItem("xp") || 0);

const levels = [
  {name:"Hobby Fitness",xp:0},
  {name:"Fitness Grinder",xp:100},
  {name:"Strength Builder",xp:300},
  {name:"Advanced Lifter",xp:700},
  {name:"Fitness Master",xp:1500}
];

function updateXP(){
  let lvl = levels[0];
  let next = levels[1].xp;

  for(let i=levels.length-1;i>=0;i--){
    if(xp>=levels[i].xp){
      lvl = levels[i];
      next = levels[i+1]?.xp || levels[i].xp;
      break;
    }
  }

  document.getElementById("levelName").textContent = lvl.name;
  document.getElementById("xpText").textContent = `${xp} / ${next} XP`;
  document.getElementById("xpFill").style.width = Math.min(100, xp/next*100) + "%";
}

updateXP();

/* ===== SERVICE WORKER ===== */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
