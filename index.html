<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>GYM LOG</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020617">

<link rel="manifest" href="manifest.json">

<style>
/* ===== iOS FULLSCREEN + NO WHITE BARS ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #020617;
  overscroll-behavior: none;
}

body {
  min-height: 100svh;
  padding: env(safe-area-inset-top)
           env(safe-area-inset-right)
           env(safe-area-inset-bottom)
           env(safe-area-inset-left);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: #e5e7eb;
}

.hidden { display: none; }

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px;
  min-height: 100svh;
  background: #020617;
}

/* ===== SPLASH ===== */
#splash {
  position: fixed;
  inset: 0;
  background: #020617;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}

#splash h1 {
  font-size: 44px;
  letter-spacing: 6px;
  background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ===== UI ===== */
button {
  width: 100%;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid #1e293b;
  background: #020617;
  color: #e5e7eb;
  font-size: 16px;
}

button.primary {
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  border: none;
  font-weight: 700;
}

.item {
  border: 1px solid #1e293b;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 8px;
  background: #020617;
}

header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

header h1 {
  flex: 1;
  text-align: center;
  margin: 0;
  font-size: 20px;
}

header button {
  background: none;
  border: none;
  color: #3b82f6;
  font-size: 20px;
}
</style>
</head>

<body>

<div id="splash">
  <h1>GYM LOG</h1>
</div>

<div id="app" class="hidden">

<header>
  <button id="backBtn" class="hidden">←</button>
  <h1>Gym Log</h1>
</header>

<section id="home">
  <button class="primary" id="startBtn">🏋️ Trénink</button>
</section>

<section id="categories" class="hidden"></section>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const splash = document.getElementById("splash");
  const app = document.getElementById("app");
  const startBtn = document.getElementById("startBtn");
  const backBtn = document.getElementById("backBtn");
  const home = document.getElementById("home");
  const categories = document.getElementById("categories");

  /* ===== SPLASH SAFE HIDE ===== */
  setTimeout(() => {
    splash.style.display = "none";
    app.classList.remove("hidden");
  }, 1000);

  /* ===== DATABASE ===== */
  const db = {
    Prsa: ["Bench Press", "Incline Bench", "Dips"],
    Záda: ["Pull-ups", "Lat Pulldown", "Deadlift"],
    Nohy: ["Squat", "Leg Press", "Lunges"],
    Ramena: ["Overhead Press", "Lateral Raise"],
    Ruce: ["Biceps Curl", "Triceps Pushdown"]
  };

  /* ===== NAV ===== */
  startBtn.onclick = () => {
    categories.innerHTML = "";
    Object.keys(db).forEach(cat => {
      const div = document.createElement("div");
      div.className = "item";
      div.textContent = cat;
      categories.appendChild(div);
    });
    home.classList.add("hidden");
    categories.classList.remove("hidden");
    backBtn.classList.remove("hidden");
  };

  backBtn.onclick = () => {
    categories.classList.add("hidden");
    home.classList.remove("hidden");
    backBtn.classList.add("hidden");
  };

  /* ===== SERVICE WORKER ===== */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }

});
</script>

</body>
</html>
