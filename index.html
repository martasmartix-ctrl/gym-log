<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>GYM LOG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/confetti-js@0.0.18/dist/index.min.js"></script>
    <style>
        /* ===== iOS FULLSCREEN + NO WHITE BARS ===== */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #020617;
            overscroll-behavior: none;
        }
        body {
            min-height: 100svh;
            padding: env(safe-area-inset-top)
                     env(safe-area-inset-right)
                     env(safe-area-inset-bottom)
                     env(safe-area-inset-left);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: #e5e7eb;
        }
        .hidden { display: none; }
        #app {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100svh;
            background: #020617;
        }
        /* ===== SPLASH ===== */
        #splash {
            position: fixed;
            inset: 0;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #splash h1 {
            font-size: 44px;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0%; }
            50% { background-position: 100%; }
            100% { background-position: 0%; }
        }
        /* ===== UI ===== */
        button {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid #1e293b;
            background: #020617;
            color: #e5e7eb;
            font-size: 16px;
            margin-bottom: 8px;
            transition: transform 0.2s, background 0.3s;
        }
        button:hover {
            transform: scale(1.02);
            background: #0f172a;
        }
        button.primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            font-weight: 700;
            animation: shine 2s infinite;
        }
        @keyframes shine {
            0% { background-position: 0%; }
            100% { background-position: 200%; }
        }
        .item {
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 8px;
            background: #020617;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .item:hover {
            background: #0f172a;
            transform: translateY(-2px);
        }
        header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        header h1 {
            flex: 1;
            text-align: center;
            margin: 0;
            font-size: 20px;
        }
        header button {
            background: none;
            border: none;
            color: #3b82f6;
            font-size: 20px;
            transition: color 0.3s;
        }
        header button:hover {
            color: #8b5cf6;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            background: #0f172a;
            color: #e5e7eb;
            margin-bottom: 8px;
            transition: border 0.3s;
        }
        input:focus {
            border: 1px solid #3b82f6;
            outline: none;
        }
        .set-input {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .set-input input {
            flex: 1;
        }
        .set-input button {
            width: auto;
            padding: 12px 20px;
            background: #3b82f6;
            border: none;
            color: white;
        }
        #currentSets .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #graph {
            margin-top: 16px;
            background: #0f172a;
            border-radius: 16px;
            padding: 8px;
        }
        .level-info {
            text-align: center;
            margin-bottom: 16px;
            font-size: 18px;
            color: #3b82f6;
            animation: glow 1.5s infinite;
        }
        @keyframes glow {
            0% { text-shadow: 0 0 5px #3b82f6; }
            50% { text-shadow: 0 0 15px #3b82f6; }
            100% { text-shadow: 0 0 5px #3b82f6; }
        }
        #searchInput {
            margin-bottom: 16px;
        }
        .progress-bar {
            width: 100%;
            background: #1e293b;
            border-radius: 8px;
            height: 10px;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            transition: width 0.5s;
        }
    </style>
</head>
<body>
    <div id="splash">
        <h1>GYM LOG</h1>
    </div>
    <div id="app" class="hidden">
        <header>
            <button id="backBtn" class="hidden">←</button>
            <h1 id="headerTitle">Gym Log</h1>
        </header>
        <section id="home">
            <button class="primary" id="startTrainingBtn">🏋️ Začít Trénink</button>
            <button class="primary" id="viewProgressBtn">📊 Zobrazit Pokrok</button>
            <button class="primary" id="viewLevelsBtn">⭐ Úrovně</button>
        </section>
        <section id="categories" class="hidden">
            <input type="text" id="searchInput" placeholder="Hledej kategorii nebo cvik...">
            <div id="categoryList"></div>
        </section>
        <section id="exercises" class="hidden">
            <input type="text" id="exerciseSearchInput" placeholder="Hledej cvik...">
            <div id="exerciseList"></div>
        </section>
        <section id="logging" class="hidden">
            <div id="currentSets"></div>
            <div class="set-input">
                <input type="number" id="weightInput" placeholder="Váha (kg)" min="0">
                <input type="number" id="repsInput" placeholder="Opakování" min="1">
                <button id="addSetBtn">+</button>
            </div>
            <button class="primary" id="saveSessionBtn">Uložit Sezení</button>
        </section>
        <section id="progress" class="hidden">
            <canvas id="graph" width="400" height="200"></canvas>
            <div id="history"></div>
        </section>
        <section id="levels" class="hidden">
            <div class="level-info" id="levelInfo"></div>
            <div class="progress-bar">
                <div id="xpProgress" class="progress-fill"></div>
            </div>
            <p>Motivace: Každá série ti dává XP. Zlepšuj se a dosáhni vyšších úrovní! 🎉</p>
            <canvas id="confettiCanvas" style="position: fixed; top: 0; left: 0; pointer-events: none; z-index: 100;"></canvas>
        </section>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splash = document.getElementById("splash");
            const app = document.getElementById("app");
            const backBtn = document.getElementById("backBtn");
            const headerTitle = document.getElementById("headerTitle");
            const home = document.getElementById("home");
            const categories = document.getElementById("categories");
            const exercises = document.getElementById("exercises");
            const logging = document.getElementById("logging");
            const progress = document.getElementById("progress");
            const levels = document.getElementById("levels");
            const startTrainingBtn = document.getElementById("startTrainingBtn");
            const viewProgressBtn = document.getElementById("viewProgressBtn");
            const viewLevelsBtn = document.getElementById("viewLevelsBtn");
            const addSetBtn = document.getElementById("addSetBtn");
            const saveSessionBtn = document.getElementById("saveSessionBtn");
            const weightInput = document.getElementById("weightInput");
            const repsInput = document.getElementById("repsInput");
            const currentSets = document.getElementById("currentSets");
            const graphCanvas = document.getElementById("graph");
            const historyDiv = document.getElementById("history");
            const levelInfo = document.getElementById("levelInfo");
            const searchInput = document.getElementById("searchInput");
            const exerciseSearchInput = document.getElementById("exerciseSearchInput");
            const categoryList = document.getElementById("categoryList");
            const exerciseList = document.getElementById("exerciseList");
            const xpProgress = document.getElementById("xpProgress");
            const confettiCanvas = document.getElementById("confettiCanvas");

            let currentCategory = "";
            let currentExercise = "";
            let currentSessionSets = [];
            let chart;
            let confetti;

            // ===== SPLASH SAFE HIDE =====
            setTimeout(() => {
                splash.style.display = "none";
                app.classList.remove("hidden");
            }, 1500);

            // ===== CONFETTI SETUP =====
            confetti = new ConfettiGenerator({ target: 'confettiCanvas' });

            // ===== DATABASE OF CATEGORIES AND EXERCISES =====
            const db = {
                "Prsa": [
                    "Bench Press", "Incline Bench Press", "Decline Bench Press", "Dumbbell Bench Press", "Dumbbell Flyes",
                    "Cable Flyes", "Push-ups", "Dips", "Machine Chest Press", "Pec Deck", "Svend Press", "Around the Worlds",
                    "Plate Press", "Chest Squeeze", "Incline Dumbbell Press", "Decline Dumbbell Press", "Hex Press",
                    "Landmine Press", "Close Grip Bench Press", "Wide Grip Bench Press", "Pause Bench Press"
                ],
                "Záda": [
                    "Pull-ups", "Chin-ups", "Lat Pulldown", "Seated Row", "Bent Over Row", "Deadlift", "Romanian Deadlift",
                    "T-Bar Row", "Face Pulls", "Inverted Row", "Single Arm Dumbbell Row", "Barbell Row", "Pendlay Row",
                    "Rack Pulls", "Good Mornings", "Hyperextensions", "Superman", "Bird Dog", "Shrugs", "Farmer's Walk",
                    "Yates Row", "Meadows Row", "Kroc Row", "Helms Row"
                ],
                "Nohy": [
                    "Squat", "Front Squat", "Back Squat", "Goblet Squat", "Leg Press", "Hack Squat", "Lunges", "Walking Lunges",
                    "Bulgarian Split Squat", "Step-ups", "Calf Raises", "Seated Calf Raise", "Leg Extension", "Leg Curl",
                    "Romanian Deadlift", "Stiff Leg Deadlift", "Glute Bridge", "Hip Thrust", "Sumo Squat", "Pistol Squat",
                    "Box Jump", "Jump Squat", "Wall Sit", "Donkey Kicks", "Fire Hydrants"
                ],
                "Ramena": [
                    "Overhead Press", "Military Press", "Dumbbell Shoulder Press", "Arnold Press", "Lateral Raise",
                    "Front Raise", "Rear Delt Fly", "Face Pull", "Upright Row", "Shrugs", "Push Press", "Jerk",
                    "Handstand Push-up", "Pike Push-up", "Cuban Press", "External Rotation", "Internal Rotation",
                    "Plate Front Raise", "Bus Driver", "Shoulder Circles", "Band Pull Apart", "Reverse Fly"
                ],
                "Biceps": [
                    "Biceps Curl", "Dumbbell Curl", "Barbell Curl", "EZ Bar Curl", "Hammer Curl", "Concentration Curl",
                    "Preacher Curl", "Cable Curl", "Incline Dumbbell Curl", "Spider Curl", "Drag Curl", "Zottman Curl",
                    "21s", "Reverse Curl", "Wrist Curl", "Chin-ups", "Close Grip Pull-up", "Bicep Squeeze",
                    "Isometric Hold", "Negative Curls"
                ],
                "Triceps": [
                    "Triceps Pushdown", "Skull Crusher", "Close Grip Bench Press", "Dips", "Overhead Triceps Extension",
                    "Dumbbell Kickback", "Rope Pushdown", "Diamond Push-ups", "Bench Dips", "French Press",
                    "Triceps Kickback", "Cable Overhead Extension", "Lying Triceps Extension", "Seated Triceps Press",
                    "Reverse Grip Pushdown", "JM Press", "Tate Press", "Floor Press", "Band Pushdown"
                ],
                "Břicho": [
                    "Crunches", "Sit-ups", "Leg Raises", "Hanging Leg Raise", "Plank", "Side Plank", "Russian Twist",
                    "Bicycle Crunch", "Mountain Climbers", "Flutter Kicks", "Scissor Kicks", "Toe Touches", "V-ups",
                    "Dragon Flag", "Windshield Wipers", "Ab Wheel Rollout", "Cable Crunch", "Woodchoppers",
                    "Reverse Crunch", "Heel Taps", "Bird Dog", "Dead Bug"
                ],
                "Lýtka": [
                    "Standing Calf Raise", "Seated Calf Raise", "Donkey Calf Raise", "Calf Raise on Leg Press",
                    "Single Leg Calf Raise", "Jump Rope", "Box Jumps", "Farmer's Walk on Toes", "Tibialis Raise",
                    "Calf Stretch", "Wall Calf Raise"
                ],
                "Předloktí": [
                    "Wrist Curl", "Reverse Wrist Curl", "Farmer's Walk", "Plate Pinch", "Gripper", "Hammer Curl",
                    "Towel Pull-up", "Fat Grip Curl", "Wrist Roller", "Finger Curls"
                ],
                "Trapézy": [
                    "Shrugs", "Dumbbell Shrugs", "Barbell Shrugs", "Farmer's Walk", "Rack Pulls", "Upright Row",
                    "Face Pull", "Power Clean", "Snatch", "High Pull"
                ],
                "Celé Tělo": [
                    "Burpees", "Clean and Jerk", "Snatch", "Thrusters", "Kettlebell Swing", "Turkish Get-up",
                    "Bear Crawl", "Farmer's Carry", "Sled Push", "Battle Ropes"
                ]
                // Přidej další kategorie podle potřeby
            };

            // Flatten all exercises for global search
            const allExercises = Object.entries(db).flatMap(([cat, exs]) => exs.map(ex => ({ cat, ex })));

            // ===== DATA STORAGE =====
            function loadData() {
                const logs = JSON.parse(localStorage.getItem('gymLogs')) || {};
                const user = JSON.parse(localStorage.getItem('gymUser')) || { level: 1, xp: 0, totalSets: 0 };
                return { logs, user };
            }

            function saveData(logs, user) {
                localStorage.setItem('gymLogs', JSON.stringify(logs));
                localStorage.setItem('gymUser', JSON.stringify(user));
            }

            let { logs, user } = loadData();

            // ===== LEVELING SYSTEM =====
            function addXP(amount) {
                const oldLevel = user.level;
                user.xp += amount;
                user.totalSets += amount / 10;
                while (user.xp >= user.level * 100) {
                    user.xp -= user.level * 100;
                    user.level++;
                }
                saveData(logs, user);
                if (user.level > oldLevel) {
                    confetti.render();
                    setTimeout(() => confetti.clear(), 3000);
                }
            }

            function showLevels() {
                levelInfo.innerHTML = `Úroveň: ${user.level}<br>XP: ${user.xp} / ${user.level * 100}<br>Celkové Série: ${user.totalSets}`;
                const progressPercent = (user.xp / (user.level * 100)) * 100;
                xpProgress.style.width = `${progressPercent}%`;
            }

            // ===== NAVIGATION HELPERS =====
            function showSection(section) {
                [home, categories, exercises, logging, progress, levels].forEach(s => s.classList.add("hidden"));
                section.classList.remove("hidden");
            }

            function updateBackBtn(visible) {
                backBtn.classList.toggle("hidden", !visible);
            }

            // ===== HOME BUTTONS =====
            startTrainingBtn.onclick = () => {
                showCategories("Trénink");
            };

            viewProgressBtn.onclick = () => {
                showCategories("Pokrok");
            };

            viewLevelsBtn.onclick = () => {
                showSection(levels);
                showLevels();
                headerTitle.textContent = "Úrovně";
                updateBackBtn(true);
            };

            // ===== SHOW CATEGORIES WITH SEARCH =====
            function showCategories(mode) {
                categoryList.innerHTML = "";
                Object.keys(db).forEach(cat => {
                    const div = document.createElement("div");
                    div.className = "item";
                    div.textContent = cat;
                    div.onclick = () => {
                        currentCategory = cat;
                        showExercises(mode);
                    };
                    categoryList.appendChild(div);
                });
                showSection(categories);
                headerTitle.textContent = mode === "Trénink" ? "Kategorie" : "Vyber Partii pro Pokrok";
                updateBackBtn(true);

                // Global search for exercises
                searchInput.oninput = () => {
                    const query = searchInput.value.toLowerCase();
                    categoryList.innerHTML = "";
                    if (query) {
                        const filtered = allExercises.filter(({ ex }) => ex.toLowerCase().includes(query));
                        filtered.forEach(({ cat, ex }) => {
                            const div = document.createElement("div");
                            div.className = "item";
                            div.innerHTML = `<strong>${ex}</strong> (${cat})`;
                            div.onclick = () => {
                                currentCategory = cat;
                                currentExercise = ex;
                                if (mode === "Trénink") {
                                    startLogging();
                                } else {
                                    showProgress();
                                }
                            };
                            categoryList.appendChild(div);
                        });
                    } else {
                        Object.keys(db).forEach(cat => {
                            const div = document.createElement("div");
                            div.className = "item";
                            div.textContent = cat;
                            div.onclick = () => {
                                currentCategory = cat;
                                showExercises(mode);
                            };
                            categoryList.appendChild(div);
                        });
                    }
                };
            }

            // ===== SHOW EXERCISES WITH SEARCH =====
            function showExercises(mode) {
                exerciseList.innerHTML = "";
                db[currentCategory].forEach(ex => {
                    const div = document.createElement("div");
                    div.className = "item";
                    div.textContent = ex;
                    div.onclick = () => {
                        currentExercise = ex;
                        if (mode === "Trénink") {
                            startLogging();
                        } else {
                            showProgress();
                        }
                    };
                    exerciseList.appendChild(div);
                });
                showSection(exercises);
                headerTitle.textContent = currentCategory;
                exerciseSearchInput.value = "";

                exerciseSearchInput.oninput = () => {
                    const query = exerciseSearchInput.value.toLowerCase();
                    exerciseList.innerHTML = "";
                    db[currentCategory].filter(ex => ex.toLowerCase().includes(query)).forEach(ex => {
                        const div = document.createElement("div");
                        div.className = "item";
                        div.textContent = ex;
                        div.onclick = () => {
                            currentExercise = ex;
                            if (mode === "Trénink") {
                                startLogging();
                            } else {
                                showProgress();
                            }
                        };
                        exerciseList.appendChild(div);
                    });
                };
            }

            // ===== LOGGING =====
            function startLogging() {
                currentSessionSets = [];
                currentSets.innerHTML = "";
                showSection(logging);
                headerTitle.textContent = currentExercise;
            }

            addSetBtn.onclick = () => {
                const weight = parseFloat(weightInput.value);
                const reps = parseInt(repsInput.value);
                if (weight > 0 && reps > 0) {
                    currentSessionSets.push({ weight, reps });
                    const setDiv = document.createElement("div");
                    setDiv.className = "item";
                    setDiv.innerHTML = `<span>Váha: ${weight} kg</span><span>Opakování: ${reps}</span>`;
                    currentSets.appendChild(setDiv);
                    weightInput.value = "";
                    repsInput.value = "";
                    weightInput.focus();
                }
            };

            saveSessionBtn.onclick = () => {
                if (currentSessionSets.length > 0) {
                    const date = new Date().toISOString().split('T')[0];
                    if (!logs[currentExercise]) logs[currentExercise] = [];
                    logs[currentExercise].push({ date, sets: currentSessionSets });
                    addXP(currentSessionSets.length * 10); // 10 XP per set
                    saveData(logs, user);
                    alert("Sezení uloženo! 🎉");
                    backToHome();
                }
            };

            // ===== PROGRESS =====
            function showProgress() {
                showSection(progress);
                headerTitle.textContent = `${currentExercise} Pokrok`;
                if (!logs[currentExercise]) {
                    historyDiv.innerHTML = "<p>Žádné data ještě. 😔</p>";
                    return;
                }

                const data = logs[currentExercise];
                const labels = data.map(d => d.date);
                const oneRMs = data.map(d => {
                    const max1RM = Math.max(...d.sets.map(s => s.weight * (1 + s.reps / 30)));
                    return max1RM;
                });

                if (chart) chart.destroy();
                chart = new Chart(graphCanvas, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Odhadovaný 1RM',
                            data: oneRMs,
                            borderColor: '#3b82f6',
                            tension: 0.1
                        }]
                    },
                    options: {
                        scales: {
                            y: { beginAtZero: false }
                        },
                        animation: {
                            duration: 2000
                        }
                    }
                });

                historyDiv.innerHTML = "";
                data.forEach((session, i) => {
                    const sessDiv = document.createElement("div");
                    sessDiv.className = "item";
                    sessDiv.innerHTML = `<strong>${session.date}</strong><br>`;
                    session.sets.forEach((s, j) => {
                        sessDiv.innerHTML += `Série ${j+1}: ${s.weight} kg x ${s.reps}<br>`;
                    });
                    historyDiv.appendChild(sessDiv);
                });
            }

            // ===== BACK BUTTON =====
            backBtn.onclick = () => {
                if (!logging.classList.contains("hidden")) {
                    showExercises("Trénink");
                } else if (!progress.classList.contains("hidden")) {
                    showExercises("Pokrok");
                } else if (!exercises.classList.contains("hidden")) {
                    showCategories(!progress.classList.contains("hidden") ? "Pokrok" : "Trénink");
                } else if (!categories.classList.contains("hidden") || !levels.classList.contains("hidden")) {
                    backToHome();
                }
            };

            function backToHome() {
                showSection(home);
                headerTitle.textContent = "Gym Log";
                updateBackBtn(false);
            }

            // ===== SERVICE WORKER =====
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("service-worker.js");
            }
        });
    </script>
</body>
</html>
