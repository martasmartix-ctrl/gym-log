<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>GYM LOG</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020617">

<link rel="manifest" href="manifest.json">

<style>
/* ===== SAFE AREA FIX ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #020617;
}

body {
  min-height: 100vh;
  padding: env(safe-area-inset-top)
           env(safe-area-inset-right)
           env(safe-area-inset-bottom)
           env(safe-area-inset-left);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: #e5e7eb;
}

/* ===== THEME ===== */
:root{
  --bg:#020617;
  --card:#0b1220;
  --border:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --blue:#3b82f6;
  --purple:#8b5cf6;
  --gold:#facc15;
}

.hidden{display:none}

#app{
  max-width:480px;
  margin:0 auto;
  padding:16px;
  min-height:100vh;
}

/* ===== HEADER ===== */
header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
header h1{
  flex:1;
  text-align:center;
  margin:0;
  font-size:20px;
}
header button{
  background:none;
  border:none;
  color:var(--blue);
  font-size:18px;
}

/* ===== CARD ===== */
.card{
  background:linear-gradient(180deg,#0b1220,#020617);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
}

/* ===== LEVEL ===== */
#levelName{
  color:var(--gold);
  font-weight:700;
}
.xpbar{
  height:10px;
  background:#020617;
  border-radius:8px;
  overflow:hidden;
  margin-top:6px;
}
#xpFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--gold),var(--blue));
}

/* ===== BUTTON ===== */
button{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
  font-size:15px;
}
button.primary{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  border:none;
  font-weight:700;
}

/* ===== LIST ITEM ===== */
.item{
  background:#020617;
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-bottom:8px;
}

/* ===== INPUT ===== */
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
  margin-bottom:8px;
}

/* ===== GRAPH ===== */
canvas{
  width:100%;
  margin-top:10px;
}
</style>
</head>

<body>

<div id="app">

<header>
  <button id="backBtn" class="hidden">←</button>
  <h1>Gym Log</h1>
</header>

<!-- HOME -->
<section id="home">
  <div class="card">
    <div id="levelName">Hobby Fitness</div>
    <div class="xpbar"><div id="xpFill"></div></div>
    <small id="xpText">0 / 100 XP</small>
  </div>
  <button class="primary" onclick="openCategories()">🏋️ Trénink</button>
</section>

<!-- CATEGORIES -->
<section id="categories" class="hidden"></section>

<!-- EXERCISES -->
<section id="exercises" class="hidden">
  <input id="search" placeholder="🔍 Hledat cvik">
  <div id="exerciseList"></div>
</section>

<!-- LOG -->
<section id="log" class="hidden">
  <h3 id="exerciseTitle"></h3>
  <input id="weight" type="number" placeholder="Váha (kg)">
  <input id="sets" type="number" placeholder="Série">
  <input id="reps" type="number" placeholder="Opakování">
  <button class="primary" onclick="saveLog()">Uložit výkon</button>
  <canvas id="chart" height="120"></canvas>
</section>

</div>

<script>
const $=id=>document.getElementById(id);
const screens=["home","categories","exercises","log"];
let stack=[],currentCat="",currentEx="";

/* ===== DATABASE ===== */
const db={
Prsa:["Bench Press","Incline Bench","Dips","Chest Press"],
Záda:["Pull-ups","Lat Pulldown","Barbell Row","Deadlift"],
Ramena:["Overhead Press","Lateral Raise","Face Pull"],
Nohy:["Squat","Leg Press","RDL","Calf Raise"],
Ruce:["Biceps Curl","Hammer Curl","Triceps Pushdown"],
Core:["Plank","Crunch","Hanging Leg Raise"]
};

/* ===== XP ===== */
let xp=+localStorage.getItem("xp")||0;
const levels=[
{name:"Hobby Fitness",xp:0},
{name:"Fitness Grinder",xp:100},
{name:"Strength Builder",xp:300},
{name:"Advanced Lifter",xp:700},
{name:"Fitness Master",xp:1500}
];

function updateXP(){
  let lvl=levels[0],next=levels[1].xp;
  for(let i=levels.length-1;i>=0;i--){
    if(xp>=levels[i].xp){
      lvl=levels[i];
      next=levels[i+1]?.xp||levels[i].xp;
      break;
    }
  }
  $("levelName").textContent=lvl.name;
  $("xpText").textContent=`${xp} / ${next} XP`;
  $("xpFill").style.width=Math.min(100,xp/next*100)+"%";
}

/* ===== NAV ===== */
function show(s){
  screens.forEach(x=>$(x).classList.add("hidden"));
  $(s).classList.remove("hidden");
  stack.push(s);
  $("backBtn").classList.toggle("hidden",stack.length<=1);
}
$("backBtn").onclick=()=>{stack.pop();show(stack.pop()||"home")};

/* ===== FLOW ===== */
function openCategories(){
  $("categories").innerHTML="";
  Object.keys(db).forEach(c=>{
    let d=document.createElement("div");
    d.className="item";
    d.textContent=c;
    d.onclick=()=>openExercises(c);
    $("categories").appendChild(d);
  });
  show("categories");
}

function openExercises(c){
  currentCat=c;
  $("exerciseList").innerHTML="";
  $("search").value="";
  db[c].forEach(addExercise);
  $("search").oninput=e=>{
    $("exerciseList").innerHTML="";
    db[c].filter(x=>x.toLowerCase().includes(e.target.value.toLowerCase())).forEach(addExercise);
  };
  show("exercises");
}

function addExercise(e){
  let d=document.createElement("div");
  d.className="item";
  d.textContent=e;
  d.onclick=()=>openLog(e);
  $("exerciseList").appendChild(d);
}

function openLog(e){
  currentEx=e;
  $("exerciseTitle").textContent=e;
  show("log");
}

function saveLog(){
  let w=+$("weight").value;
  if(!w) return;
  xp+=10;
  localStorage.setItem("xp",xp);
  updateXP();
  $("weight").value="";
}

/* INIT */
updateXP();
</script>

</body>
</html>
